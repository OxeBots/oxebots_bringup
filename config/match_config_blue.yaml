/**:
  ros__parameters:
    is_yellow_team: false
    team_size: 3
    bt_xml_path: "master_strategy_el.xml"
    execution_rate: 60.0
    operational_kickers: [0, 1, 2]

# Simulator controller configuration
grSim_controller_node:
  ros__parameters:
    simulator_ip: "127.0.0.1"
    simulator_port: 10301
    interface_ip: ""
    command_topic: "robot_commands"

# SSL-Vision and Game Controller multicast bridges
ssl_vision_bridge:
  ros__parameters:
    ssl_vision_ip: "224.5.23.2"
    ssl_vision_port: 10020
    net_interface_address: ""

gc_multicast_bridge:
  ros__parameters:
    multicast.address: "224.5.23.1"
    multicast.port: 10003
    net_interface_address: ""

team_client_node:
  ros__parameters:
    gc_ip_address: ""
    gc_port: 10008
    # Para testar com o Game Controller, altere team_name para o mesmo nome selecionado na interface do GC
    team_name: "Unknown"
    # team_color não é definido aqui: o ssl-new.launch.py o deriva de is_yellow_team (topo do arquivo).
    ping_period: 5.0

# Game observer and occupancy grid generation
game_observer_node:
  ros__parameters:
    robot_amount: 3
    min_ball_confidence: 0.0
    map_resolution: 0.05
    robot_inflation_radius: 150.0
    robot_expiration_ms: 500.0
    ball_expiration_ms: 500.0
    vision_topic: "/ssl_vision_bridge/vision_messages"
    publisher_topic: "game_data"
    referee_topic: "/gc_multicast_bridge/referee_messages"

# Strategy node configuration
strategy_node:
  ros__parameters:
    gc_topic: "/gc_multicast_bridge/referee_messages"

# Referee state node configuration
referee_state_node:
  ros__parameters:
    gc_topic: "/gc_multicast_bridge/referee_messages"
    ball_topic: "ball_data"
    stale_timeout_ms: 500.0
    ball_moved_mm: 50.0
    kick_timeout_s: 10.0
    stop_speed_mps: 0.75
    play_speed_mps: 1.5

# NRF24 radio hardware bridge configuration (RX and TX addresses must be 5 characters)
nrf24_hardware_bridge:
  ros__parameters:
    radio_rx_address: "ADMIN"         # Endereço RX local do dongle USB (Pipe 0)
    radio_tx_address: "ESP32"         # Endereço TX destino (robôs ESP32)
    radio_frequency: 2.476            # Frequência em GHz (2.476 GHz = Canal 76 do nRF24)
    radio_rate: 3                     # Taxa de dados no ar (1=250Kbps, 2=1Mbps, 3=2Mbps)
    command_mode: "velocity"          # "velocity" (/robot_commands) ou "point" (/robot_trajectory_setpoints)
    telemetry_request_interval: 5     # Solicita telemetria a cada N comandos por robô (0 = desativa telemetria)
