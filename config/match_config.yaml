/**:
  ros__parameters:
    is_yellow_team: false
    team_size: 3
    bt_xml_path: "master_strategy_carry.xml"
    execution_rate: 60.0
    # false só para testes sem GC (ou require_gc:=false no launch). Fica só aqui: vale para o
    # referee_state_node e para os strategy_node_N (o nome numerado não casa com a seção
    # "strategy_node:", e o ROS 2 não aceita "strategy_node_*" como nome de nó).
    require_gc: true
    # Tolerâncias de idade dos dados na strategy_node_N (usadas pelo IsDataFresh)
    max_gc_ms: 500.0
    max_pose_ms: 150.0
    max_ball_ms: 300.0
    # Piso global de velocidades (m/s e rad/s) herdado por todos os nós de estratégia.
    # 0.0 desativa o piso. Comandos parados (HALT, TIMEOUT, arrived, watchdog) permanecem 0.0
    # e o teto máximo (com todas as suas exceções) sempre tem precedência sobre a mínima.
    min_linear_speed: 0.350
    min_angular_speed: 1.400
    p_gain_linear: 10.0
    d_gain_linear: 0.00
    p_gain_angular: 2.20
    d_gain_angular: 0.25
    lookahead_distance: 140.0
    use_kalman_filter: true
    latency_comp_s: 0.045

# Simulator controller configuration
grSim_controller_node:
  ros__parameters:
    simulator_ip: "127.0.0.1"
    simulator_port: 10301
    interface_ip: ""
    command_topic: "robot_commands"

# SSL-Vision and Game Controller multicast bridges
ssl_vision_bridge:
  ros__parameters:
    ssl_vision_ip: "224.5.23.2"
    ssl_vision_port: 10006
    net_interface_address: ""

gc_multicast_bridge:
  ros__parameters:
    multicast.address: "224.5.23.1"
    multicast.port: 10003
    net_interface_address: ""

team_client_node:
  ros__parameters:
    gc_ip_address: ""
    gc_port: 10008
    # Para testar com o Game Controller, altere team_name para o mesmo nome selecionado na interface do GC
    team_name: "Unknown"
    # team_color não é definido aqui: o ssl-new.launch.py o deriva de is_yellow_team (topo do arquivo).
    ping_period: 5.0

# Game observer and occupancy grid generation
game_observer_node:
  ros__parameters:
    robot_amount: 3
    min_ball_confidence: 0.0
    map_resolution: 0.05
    robot_inflation_radius: 150.0
    vision_topic: "/ssl_vision_bridge/vision_messages"
    publisher_topic: "game_data"
    referee_topic: "/gc_multicast_bridge/referee_messages"

# Referee state node configuration
referee_state_node:
  ros__parameters:
    gc_topic: "/gc_multicast_bridge/referee_messages"
    ball_topic: "ball_data"
    stale_timeout_ms: 500.0
    ball_moved_mm: 50.0
    kick_timeout_s: 10.0
    stop_speed_mps: 3.0
    play_speed_mps: 10.0

# Troca de papéis atacante/zagueiro. Para trocar mais rápido, reduza os dois valores; se os
# papéis começarem a oscilar entre os dois robôs, aumente-os de novo.
role_assigner_node:
  ros__parameters:
    time_hysteresis: 1.0  # tempo mínimo (s) entre trocas (padrão do código: 2.0)
    hysteresis: 1.5       # vantagem de custo para tomar o papel do atacante (padrão do código: 2.5)
    ball_flight_speed_mps: 1.0  # bola mais rápida que isto = chute em voo: papéis congelados (0 desliga)
    receive_distance_mm: 300.0  # candidato a menos disto da bola E bola lenta (<80% do limite de voo) = recepcionou: libera a troca

# ESP32 Base Station Dual-nRF24L01+ Full-Duplex hardware bridge configuration
nrf24_hardware_bridge:
  ros__parameters:
    serial_port: "auto"               # "auto" detecta a ESP32 Base Station via BS_MSG_PING
    serial_baud: 921600               # Baud rate UART0 COBS+CRC8
    radio_channel: 76                 # Canal TX inicial (downlink Base->Robôs, 0..125)
    radio_rx_channel: 90              # Canal RX inicial Full-Duplex (uplink Robôs->Base, +14 MHz)
    radio_rate: 1                     # 0=1Mbps, 1=2Mbps, 2=250Kbps
    radio_pa_level: 3                 # 0=MIN, 1=LOW, 2=HIGH, 3=MAX (0 dBm)
    radio_retransmit_delay: 1         # ARD: (val + 1) * 250 us -> 500 us
    radio_retransmit_count: 3         # ARC: retentativas rápidas em hardware
    auto_select_channel: false        # Gerenciado pelo radio_channel_manager_node
    command_mode: "velocity"          # "velocity" (/robot_commands) ou "point" (/robot_trajectory_setpoints)
    telemetry_request_interval: 5     # Solicita telemetria a cada N comandos por robô (0 = desativa)

# Gerenciador automático de espectro e par Full-Duplex (TX/RX)
radio_channel_manager:
  ros__parameters:
    scan_on_startup: true
    startup_delay_s: 2.0
    periodic_scan_interval_s: 30.0
    scan_samples_per_channel: 24
    min_channel_separation: 10        # Separação mínima TX/RX em MHz (piso seletividade 2 Mbps)
    optimal_channel_separation: 14    # Separação ótima TX/RX em MHz na faixa limpa 100..124
    startup_busy_threshold_pct: 15
    periodic_busy_threshold_pct: 25
    min_busy_improvement_pct: 15
    loss_ack_threshold_pct: 85.0      # Gatilho reativo de perda no downlink (TX ACK%)
    loss_retry_threshold: 1.5
    loss_tel_rx_threshold_pct: 75.0   # Gatilho reativo de perda no uplink (telemetria RX%)
    loss_confirm_windows: 3           # 3 janelas de 0.5 s = 1.5 s contínuos de perda
    min_window_tx: 20
    min_window_tel_req: 6
    migration_max_attempts: 15
    migration_cooldown_s: 20.0
    periodic_only_when_stopped: false